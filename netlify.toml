[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# L'app usa HashRouter, quindi il server serve sempre "/".
# Questa regola la tiene funzionante anche se un giorno si passa a BrowserRouter.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Il service worker non va mai messo in cache: altrimenti i browser
# continuano a servire la versione vecchia dell'app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
